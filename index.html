<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shandalar Rotisserie Draft Engine</title>
  
  <!-- Tailwind CSS, React, Lucide Icons & LZ-String Compression -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=MedievalSharp&display=swap');

    .font-shandalar { font-family: 'Cinzel', serif; }
    .font-parchment { font-family: 'MedievalSharp', cursive; }

    /* Custom Shandalar Fantasy Theme */
    .bg-shandalar-wood {
      background: #0f0b08;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(120, 53, 15, 0.25), transparent 70%),
        linear-gradient(to bottom, #19100a, #0b0704);
    }
    
    .gold-border {
      border: 2px solid #b45309;
      box-shadow: 0 0 10px rgba(180, 83, 9, 0.3), inset 0 0 8px rgba(0,0,0,0.8);
    }

    .gold-text-glow {
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
    }

    /* Hide scrollbars for clean UI */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-shandalar-wood text-amber-100 min-h-screen font-sans antialiased selection:bg-amber-600 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const { 
      Upload, Play, RefreshCw, Layers, Users, Settings, 
      Copy, Check, Eye, FileText, ArrowRightLeft, Shield, Sparkles,
      ListOrdered, CheckCircle2, ChevronRight, BookmarkPlus, Zap
    } = lucideReact;

    // Scryfall Batch Fetcher (Chunked up to 75 per HTTP request)
    async function fetchScryfallBatch(cardNames) {
      const uniqueNames = Array.from(new Set(cardNames));
      const chunks = [];
      for (let i = 0; i < uniqueNames.length; i += 75) {
        chunks.push(uniqueNames.slice(i, i + 75));
      }

      const map = {};
      for (const chunk of chunks) {
        try {
          const res = await fetch("https://api.scryfall.com/cards/collection", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identifiers: chunk.map(name => ({ name })) })
          });
          const json = await res.json();
          if (json.data) {
            json.data.forEach(card => {
              const img = card.image_uris?.normal || 
                          card.card_faces?.[0]?.image_uris?.normal || 
                          "https://cards.scryfall.io/back.png";
              map[card.name.toLowerCase()] = {
                id: card.id,
                name: card.name,
                image: img,
                cmc: card.cmc || 0,
                colors: card.colors || (card.card_faces?.[0]?.colors) || ["C"],
                type: card.type_line || "Card"
              };
            });
          }
          await new Promise(r => setTimeout(r, 100)); // Respect Scryfall 100ms rate limits
        } catch (err) {
          console.error("Scryfall batch fetch failed:", err);
        }
      }
      return map;
    }

    // Helper: Build Full Rotisserie Turn Pick Order
    function generateRotisseriePickSequence(numPlayers, totalCap, doublePickStartPick) {
      const sequence = [];
      let forward = true;
      let currentSeat = 0;

      while (sequence.length < totalCap) {
        const pickNumber = sequence.length + 1;
        const picksAllowedThisTurn = (pickNumber >= doublePickStartPick) ? 2 : 1;

        for (let p = 0; p < picksAllowedThisTurn; p++) {
          if (sequence.length < totalCap) {
            sequence.push(currentSeat);
          }
        }

        // Snake logic shift
        if (forward) {
          if (currentSeat === numPlayers - 1) {
            forward = false;
          } else {
            currentSeat++;
          }
        } else {
          if (currentSeat === 0) {
            forward = true;
          } else {
            currentSeat--;
          }
        }
      }
      return sequence;
    }

    function App() {
      // Configuration & Setup State
      const [parsedPool, setParsedPool] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [numPlayers, setNumPlayers] = useState(4);
      const [totalDraftCap, setTotalDraftCap] = useState(180);
      const [doublePickThreshold, setDoublePickThreshold] = useState(90);
      const [playerNames, setPlayerNames] = useState(
        Array.from({ length: 4 }, (_, i) => `Drafter ${i + 1}`)
      );

      // Active Session State
      const [draftState, setDraftState] = useState(null);
      const [mySeat, setMySeat] = useState(null); // null = spectator
      const [copiedLink, setCopiedLink] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");
      const [colorFilter, setColorFilter] = useState("ALL");
      const [viewTab, setViewTab] = useState("pool"); // "pool" | "queues" | "pools"

      // Sync player name count with seat slider
      useEffect(() => {
        setPlayerNames(prev => {
          if (prev.length === numPlayers) return prev;
          if (prev.length < numPlayers) {
            const added = Array.from({ length: numPlayers - prev.length }, (_, i) => `Drafter ${prev.length + i + 1}`);
            return [...prev, ...added];
          }
          return prev.slice(0, numPlayers);
        });
      }, [numPlayers]);

      // Load session state from URL hash on load
      useEffect(() => {
        if (window.location.hash && window.location.hash.length > 1) {
          try {
            const compressed = window.location.hash.substring(1);
            const jsonStr = LZString.decompressFromEncodedURIComponent(compressed);
            if (jsonStr) {
              const loadedState = JSON.parse(jsonStr);
              setDraftState(loadedState);
            }
          } catch (e) {
            console.error("Failed to parse URL hash state", e);
          }
        }
      }, []);

      // CSV File Reader
      const handleCsvUpload = async (file) => {
        if (!file) return;
        setIsLoading(true);
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
        const names = [];
        
        lines.forEach((line, idx) => {
          if (idx === 0 && line.toLowerCase().includes("name")) return;
          const parts = line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/);
          let name = parts[0]?.replace(/^"|"$/g, '').trim();
          if (name) names.push(name);
        });

        const fetchedMap = await fetchScryfallBatch(names);
        
        const cardList = names.map((name, index) => {
          const fetched = fetchedMap[name.toLowerCase()];
          return fetched ? { ...fetched, uniqueId: `${fetched.id}-${index}` } : {
            uniqueId: `custom-${index}`,
            name: name,
            image: "https://cards.scryfall.io/back.png",
            cmc: 0,
            colors: ["C"],
            type: "Card"
          };
        });

        setParsedPool(cardList);
        setTotalDraftCap(Math.min(cardList.length, numPlayers * 45));
        setDoublePickThreshold(Math.floor(cardList.length / 2));
        setIsLoading(false);
      };

      // Launch Rotisserie Session
      const startDraft = () => {
        if (parsedPool.length === 0) return;

        const players = playerNames.map((name, i) => ({
          id: i,
          name: name || `Drafter ${i + 1}`,
          pool: [],
          queue: [], // Array of card uniqueIds
          autoDraft: false
        }));

        const pickSequence = generateRotisseriePickSequence(numPlayers, totalDraftCap, doublePickThreshold);

        const newSession = {
          players,
          availablePool: [...parsedPool],
          pickSequence,
          currentPickIndex: 0,
          totalCap: totalDraftCap,
          doublePickStart: doublePickThreshold,
          pickLog: []
        };

        setDraftState(newSession);
        updateUrlState(newSession);
      };

      // Sync state into URL hash
      const updateUrlState = (state) => {
        try {
          const jsonStr = JSON.stringify(state);
          const compressed = LZString.compressToEncodedURIComponent(jsonStr);
          window.history.replaceState(null, "", `#${compressed}`);
        } catch (e) {
          console.error("URL state sync failed:", e);
        }
      };

      // Execute a Pick Action
      const executePick = (card, seatIdx) => {
        if (!draftState) return;

        const activeSeat = draftState.pickSequence[draftState.currentPickIndex];
        if (seatIdx !== undefined && seatIdx !== activeSeat) return; // Prevent out of turn picks

        const updatedPlayers = [...draftState.players];
        const targetPlayer = updatedPlayers[activeSeat];

        // Add card to player pool and clean up queue
        targetPlayer.pool.push(card);
        targetPlayer.queue = targetPlayer.queue.filter(id => id !== card.uniqueId);

        const updatedAvailablePool = draftState.availablePool.filter(c => c.uniqueId !== card.uniqueId);
        const nextPickIndex = draftState.currentPickIndex + 1;
        const newLog = [{ player: targetPlayer.name, card: card.name, pick: nextPickIndex }, ...draftState.pickLog];

        let nextState = {
          ...draftState,
          players: updatedPlayers,
          availablePool: updatedAvailablePool,
          currentPickIndex: nextPickIndex,
          pickLog: newLog,
          isFinished: nextPickIndex >= draftState.pickSequence.length || updatedAvailablePool.length === 0
        };

        // Check if next player has Auto-Draft turned ON
        if (!nextState.isFinished) {
          const nextSeat = nextState.pickSequence[nextPickIndex];
          const nextPlayer = nextState.players[nextSeat];

          if (nextPlayer.autoDraft && nextPlayer.queue.length > 0) {
            // Find highest queued card available in pool
            const autoPickCardId = nextPlayer.queue.find(id => nextState.availablePool.some(c => c.uniqueId === id));
            if (autoPickCardId) {
              const autoCard = nextState.availablePool.find(c => c.uniqueId === autoPickCardId);
              if (autoCard) {
                // Recursively execute auto-draft pick
                setTimeout(() => executePick(autoCard, nextSeat), 300);
              }
            }
          }
        }

        setDraftState(nextState);
        updateUrlState(nextState);
      };

      // Toggle Queue Item for Logged-In Seat
      const toggleQueue = (cardId) => {
        if (mySeat === null || !draftState) return;

        const updatedPlayers = [...draftState.players];
        const player = updatedPlayers[mySeat];
        
        if (player.queue.includes(cardId)) {
          player.queue = player.queue.filter(id => id !== cardId);
        } else {
          player.queue.push(cardId);
        }

        const nextState = { ...draftState, players: updatedPlayers };
        setDraftState(nextState);
        updateUrlState(nextState);
      };

      // Toggle Auto-Draft Mode for Logged-In Seat
      const toggleAutoDraft = () => {
        if (mySeat === null || !draftState) return;

        const updatedPlayers = [...draftState.players];
        const player = updatedPlayers[mySeat];
        player.autoDraft = !player.autoDraft;

        const nextState = { ...draftState, players: updatedPlayers };
        setDraftState(nextState);
        updateUrlState(nextState);

        // Trigger immediate pick if it's currently their turn and auto-draft turned on
        const activeSeat = nextState.pickSequence[nextState.currentPickIndex];
        if (player.autoDraft && mySeat === activeSeat && player.queue.length > 0) {
          const topQueuedId = player.queue.find(id => nextState.availablePool.some(c => c.uniqueId === id));
          if (topQueuedId) {
            const card = nextState.availablePool.find(c => c.uniqueId === topQueuedId);
            if (card) executePick(card, mySeat);
          }
        }
      };

      // Copy Shareable Link to Clipboard
      const copyShareableLink = () => {
        navigator.clipboard.writeText(window.location.href);
        setCopiedLink(true);
        setTimeout(() => setCopiedLink(false), 2000);
      };

      // Filtered Available Cards
      const filteredPool = useMemo(() => {
        if (!draftState) return [];
        return draftState.availablePool.filter(card => {
          const matchesSearch = card.name.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesColor = colorFilter === "ALL" || 
                               (colorFilter === "C" && (card.colors.length === 0 || card.colors.includes("C"))) ||
                               card.colors.includes(colorFilter);
          return matchesSearch && matchesColor;
        });
      }, [draftState?.availablePool, searchTerm, colorFilter]);

      const activeSeat = draftState && !draftState.isFinished ? draftState.pickSequence[draftState.currentPickIndex] : null;
      const activePlayer = activeSeat !== null ? draftState.players[activeSeat] : null;
      const isMyTurn = mySeat !== null && mySeat === activeSeat;

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-6 min-h-screen flex flex-col">
          {/* Shandalar Fantasy Header */}
          <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-4 border-b-2 border-amber-800/60">
            <div>
              <h1 className="text-3xl font-black font-shandalar text-amber-400 gold-text-glow flex items-center gap-2">
                <Sparkles className="w-7 h-7 text-amber-500" /> Shandalar Rotisserie Draft
              </h1>
              <p className="text-xs font-parchment text-amber-200/70 mt-1">Asynchronous Open Pool Magic Drafting</p>
            </div>

            {draftState && (
              <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                <button
                  onClick={copyShareableLink}
                  className="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded-lg text-xs flex items-center gap-1.5 transition shadow-lg"
                >
                  {copiedLink ? <Check className="w-4 h-4"/> : <Copy className="w-4 h-4"/>}
                  {copiedLink ? "Link Copied!" : "Share State Link"}
                </button>

                <button 
                  onClick={() => { setDraftState(null); window.location.hash = ""; }} 
                  className="px-3 py-1.5 bg-rose-950/80 text-rose-300 rounded-lg border border-rose-800/60 hover:bg-rose-900 text-xs flex items-center gap-1"
                >
                  <RefreshCw className="w-3.5 h-3.5"/> Reset
                </button>
              </div>
            )}
          </header>

          {/* SETUP SCREEN */}
          {!draftState ? (
            <div className="grid lg:grid-cols-12 gap-6 my-auto">
              {/* CSV Drag & Drop Zone */}
              <div className="lg:col-span-7 bg-slate-950/80 p-6 rounded-2xl gold-border shadow-2xl flex flex-col justify-between backdrop-blur">
                <div>
                  <h2 className="text-lg font-bold font-shandalar mb-2 text-amber-400 flex items-center gap-2">
                    <Upload className="w-5 h-5 text-amber-500"/> 1. Upload Cube (CSV)
                  </h2>
                  <p className="text-xs text-amber-200/60 mb-4">Upload your CubeCobra CSV file to populate the draft pool from Scryfall.</p>
                  
                  <div className="border-2 border-dashed border-amber-900/60 hover:border-amber-500 bg-amber-950/20 rounded-xl p-8 text-center transition cursor-pointer relative group">
                    <input 
                      type="file" 
                      accept=".csv"
                      onChange={(e) => handleCsvUpload(e.target.files[0])}
                      className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" 
                    />
                    <Upload className="w-10 h-10 mx-auto mb-3 text-amber-700 group-hover:text-amber-400 transition" />
                    <span className="text-sm font-semibold text-amber-200 block">
                      {isLoading ? "Fetching cards from Scryfall API..." : "Drop Cube CSV file here or click to browse"}
                    </span>
                  </div>
                </div>

                {parsedPool.length > 0 && (
                  <div className="mt-6 p-4 bg-emerald-950/40 border border-emerald-800/50 rounded-xl flex items-center justify-between text-sm text-emerald-300">
                    <span className="flex items-center gap-2 font-semibold">
                      ✓ Pool Ready: {parsedPool.length} Cards Loaded
                    </span>
                  </div>
                )}
              </div>

              {/* Compact Settings Panel */}
              <div className="lg:col-span-5 bg-slate-950/80 p-6 rounded-2xl gold-border shadow-2xl flex flex-col justify-between backdrop-blur">
                <div>
                  <h2 className="text-lg font-bold font-shandalar mb-4 text-amber-400 flex items-center gap-2">
                    <Settings className="w-5 h-5 text-amber-500"/> 2. Draft Rules Setup
                  </h2>

                  <div className="space-y-4 text-xs">
                    {/* Seats Slider */}
                    <div>
                      <label className="block text-amber-300/80 mb-1 font-bold">Number of Drafters: {numPlayers}</label>
                      <input 
                        type="range" min="2" max="16"
                        value={numPlayers} 
                        onChange={e => setNumPlayers(parseInt(e.target.value))}
                        className="w-full accent-amber-500 bg-slate-900"
                      />
                    </div>

                    {/* Total Draft Cap & Double Pick Threshold */}
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-amber-300/80 mb-1 font-bold">Total Picks Cap</label>
                        <input 
                          type="number" min="10" max={parsedPool.length || 1000}
                          value={totalDraftCap} 
                          onChange={e => setTotalDraftCap(parseInt(e.target.value) || 1)}
                          className="w-full bg-slate-900 border border-amber-900/60 rounded p-2 text-amber-100 font-bold focus:border-amber-400 outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-amber-300/80 mb-1 font-bold">Double Picks Start</label>
                        <input 
                          type="number" min="1" max={totalDraftCap}
                          value={doublePickThreshold} 
                          onChange={e => setDoublePickThreshold(parseInt(e.target.value) || 1)}
                          className="w-full bg-slate-900 border border-amber-900/60 rounded p-2 text-amber-100 font-bold focus:border-amber-400 outline-none"
                        />
                      </div>
                    </div>

                    {/* Seat Names */}
                    <div>
                      <label className="block text-amber-300/80 mb-1 font-bold">Drafter Names</label>
                      <div className="grid grid-cols-2 gap-1.5 max-h-32 overflow-y-auto pr-1">
                        {playerNames.map((name, idx) => (
                          <input
                            key={idx}
                            type="text"
                            value={name}
                            onChange={(e) => {
                              const updated = [...playerNames];
                              updated[idx] = e.target.value;
                              setPlayerNames(updated);
                            }}
                            className="bg-slate-900 border border-amber-900/60 rounded px-2 py-1 text-amber-200 text-xs focus:border-amber-400 outline-none"
                            placeholder={`Seat ${idx + 1}`}
                          />
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={startDraft}
                  disabled={parsedPool.length === 0}
                  className="w-full mt-6 py-3 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-black font-shandalar rounded-xl shadow-lg transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-sm"
                >
                  <Play className="w-5 h-5 fill-current"/> Launch Rotisserie Session
                </button>
              </div>
            </div>
          ) : (
            /* ACTIVE DRAFT VIEW */
            <div className="flex-1 flex flex-col gap-6">
              {/* Top Banner: Turn Control & Seat Selector */}
              <div className="bg-slate-950/90 border-2 border-amber-800/80 rounded-2xl p-4 shadow-2xl backdrop-blur">
                <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-b border-amber-900/50 pb-4 mb-4">
                  
                  {/* Current Turn Status */}
                  <div className="flex items-center gap-3">
                    <div className="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></div>
                    <div>
                      <span className="text-[10px] font-bold text-amber-500 uppercase tracking-widest block font-shandalar">Active Drafter</span>
                      {!draftState.isFinished ? (
                        <div className="text-xl font-black text-amber-200 flex items-center gap-2">
                          <span>{activePlayer?.name}</span>
                          <span className="text-xs bg-amber-950 border border-amber-700/60 px-2 py-0.5 rounded text-amber-400 font-normal">
                            Pick {draftState.currentPickIndex + 1} / {draftState.totalCap}
                          </span>
                          {draftState.currentPickIndex + 1 >= draftState.doublePickStart && (
                            <span className="text-[10px] bg-indigo-950 text-indigo-300 border border-indigo-700 px-2 py-0.5 rounded font-bold flex items-center gap-1">
                              <Zap className="w-3 h-3 fill-current"/> Double Pick Active
                            </span>
                          )}
                        </div>
                      ) : (
                        <div className="text-emerald-400 font-bold text-lg">
                          🎉 Rotisserie Draft Complete!
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Seat Login / Spectator Switcher */}
                  <div className="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1">
                    <span className="text-xs font-bold text-amber-400 shrink-0 font-shandalar">Your Seat:</span>
                    <button
                      onClick={() => setMySeat(null)}
                      className={`px-3 py-1 rounded-lg text-xs font-semibold transition ${
                        mySeat === null 
                          ? "bg-amber-500 text-slate-950 font-bold" 
                          : "bg-slate-900 text-amber-200/70 border border-amber-900/40 hover:bg-slate-800"
                      }`}
                    >
                      Spectator
                    </button>
                    {draftState.players.map((p, idx) => (
                      <button
                        key={p.id}
                        onClick={() => setMySeat(idx)}
                        className={`px-3 py-1 rounded-lg text-xs font-semibold transition whitespace-nowrap ${
                          mySeat === idx 
                            ? "bg-amber-500 text-slate-950 font-bold shadow-md" 
                            : "bg-slate-900 text-amber-200/70 border border-amber-900/40 hover:bg-slate-800"
                        }`}
                      >
                        {p.name}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Queue & Auto-Draft Controls for Current Seat */}
                {mySeat !== null && (
                  <div className="flex flex-wrap items-center justify-between gap-3 bg-amber-950/20 p-3 rounded-xl border border-amber-900/40">
                    <div className="flex items-center gap-3">
                      <span className="text-xs font-bold text-amber-300 font-shandalar">Seat Controls ({draftState.players[mySeat].name}):</span>
                      <button
                        onClick={toggleAutoDraft}
                        className={`px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 transition ${
                          draftState.players[mySeat].autoDraft 
                            ? "bg-emerald-500 text-slate-950 shadow-lg" 
                            : "bg-slate-900 text-slate-400 border border-slate-700"
                        }`}
                      >
                        <Zap className="w-3.5 h-3.5 fill-current"/> Auto-Draft: {draftState.players[mySeat].autoDraft ? "ON" : "OFF"}
                      </button>
                    </div>

                    <div className="text-xs text-amber-200/70">
                      Queued Cards: <span className="font-bold text-amber-400">{draftState.players[mySeat].queue.length}</span>
                    </div>
                  </div>
                )}
              </div>

              {/* Sub-Navigation Tabs */}
              <div className="flex items-center justify-between border-b border-amber-900/50 pb-2">
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setViewTab("pool")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold font-shandalar transition ${
                      viewTab === "pool" ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-amber-300 hover:bg-slate-800"
                    }`}
                  >
                    Open Card Pool ({filteredPool.length})
                  </button>
                  <button
                    onClick={() => setViewTab("queues")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold font-shandalar transition ${
                      viewTab === "queues" ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-amber-300 hover:bg-slate-800"
                    }`}
                  >
                    Drafter Queues
                  </button>
                  <button
                    onClick={() => setViewTab("pools")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold font-shandalar transition ${
                      viewTab === "pools" ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-amber-300 hover:bg-slate-800"
                    }`}
                  >
                    Drafted Pools
                  </button>
                </div>

                {/* Filters for Main Card Pool */}
                {viewTab === "pool" && (
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      placeholder="Search card..."
                      value={searchTerm}
                      onChange={e => setSearchTerm(e.target.value)}
                      className="bg-slate-950 border border-amber-900/60 rounded-lg px-2.5 py-1 text-xs text-amber-100 placeholder-amber-700 focus:border-amber-400 outline-none"
                    />
                    <select
                      value={colorFilter}
                      onChange={e => setColorFilter(e.target.value)}
                      className="bg-slate-950 border border-amber-900/60 rounded-lg px-2 py-1 text-xs text-amber-300 focus:border-amber-400 outline-none font-bold"
                    >
                      <option value="ALL">All Colors</option>
                      <option value="W">White</option>
                      <option value="U">Blue</option>
                      <option value="B">Black</option>
                      <option value="R">Red</option>
                      <option value="G">Green</option>
                      <option value="C">Colorless</option>
                    </select>
                  </div>
                )}
              </div>

              {/* TAB 1: MAIN ROTISSERIE OPEN POOL */}
              {viewTab === "pool" && (
                <div className="flex-1">
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                    {filteredPool.map(card => {
                      const isQueued = mySeat !== null && draftState.players[mySeat].queue.includes(card.uniqueId);

                      return (
                        <div
                          key={card.uniqueId}
                          className={`group relative rounded-xl overflow-hidden border bg-slate-950 transition shadow-xl ${
                            isQueued ? "border-emerald-400 ring-2 ring-emerald-400/50" : "border-amber-900/60 hover:border-amber-400"
                          }`}
                        >
                          <img 
                            src={card.image} 
                            alt={card.name} 
                            className="w-full h-auto object-cover"
                            loading="lazy"
                          />

                          {/* Hover Actions */}
                          <div className="absolute inset-0 bg-slate-950/85 opacity-0 group-hover:opacity-100 transition p-3 flex flex-col justify-end items-center gap-2 text-center">
                            <span className="text-xs font-bold text-amber-300 leading-tight">{card.name}</span>

                            {isMyTurn && (
                              <button
                                onClick={() => executePick(card, mySeat)}
                                className="w-full py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-lg shadow font-shandalar"
                              >
                                Draft Card
                              </button>
                            )}

                            {mySeat !== null && (
                              <button
                                onClick={() => toggleQueue(card.uniqueId)}
                                className={`w-full py-1 text-[11px] font-bold rounded-lg transition ${
                                  isQueued 
                                    ? "bg-rose-900/80 text-rose-200 border border-rose-700" 
                                    : "bg-emerald-950/80 text-emerald-300 border border-emerald-700 hover:bg-emerald-900"
                                }`}
                              >
                                {isQueued ? "Remove Queue" : "+ Add to Queue"}
                              </button>
                            )}
                          </div>

                          {/* Queue Badge Indicator */}
                          {isQueued && (
                            <div className="absolute top-2 right-2 bg-emerald-500 text-slate-950 p-1 rounded-full shadow">
                              <BookmarkPlus className="w-3.5 h-3.5 fill-current"/>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* TAB 2: DRAFTER QUEUES */}
              {viewTab === "queues" && (
                <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
                  {draftState.players.map(player => (
                    <div key={player.id} className="bg-slate-950/80 border border-amber-900/60 rounded-xl p-4 flex flex-col">
                      <div className="flex items-center justify-between border-b border-amber-900/40 pb-2 mb-3">
                        <span className="font-bold text-amber-300 font-shandalar text-sm">{player.name}</span>
                        {player.autoDraft && (
                          <span className="text-[10px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-700 font-bold">
                            Auto-Draft ON
                          </span>
                        )}
                      </div>

                      <div className="space-y-2 flex-1 overflow-y-auto max-h-[60vh] pr-1">
                        {player.queue.length > 0 ? (
                          player.queue.map((cardId, index) => {
                            const card = draftState.availablePool.find(c => c.uniqueId === cardId);
                            if (!card) return null;
                            return (
                              <div key={cardId} className="flex items-center justify-between bg-slate-900 p-2 rounded border border-amber-900/30 text-xs">
                                <span className="text-amber-200 truncate font-medium">{index + 1}. {card.name}</span>
                                {mySeat === player.id && (
                                  <button onClick={() => toggleQueue(cardId)} className="text-rose-400 hover:text-rose-300 font-bold ml-2">
                                    ×
                                  </button>
                                )}
                              </div>
                            );
                          })
                        ) : (
                          <span className="text-xs text-amber-700 italic">No cards in queue.</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* TAB 3: DRAFTED POOLS */}
              {viewTab === "pools" && (
                <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
                  {draftState.players.map(player => (
                    <div key={player.id} className="bg-slate-950/80 border border-amber-900/60 rounded-xl p-4 flex flex-col">
                      <div className="flex items-center justify-between border-b border-amber-900/40 pb-2 mb-3">
                        <span className="font-bold text-amber-300 font-shandalar text-sm">{player.name}</span>
                        <span className="text-xs text-amber-500 font-bold">{player.pool.length} Cards</span>
                      </div>

                      <div className="space-y-1.5 flex-1 overflow-y-auto max-h-[60vh] pr-1">
                        {player.pool.map((card, idx) => (
                          <div key={card.uniqueId} className="flex items-center justify-between bg-slate-900/80 px-2 py-1 rounded text-xs text-amber-100">
                            <span className="truncate">{idx + 1}. {card.name}</span>
                            <span className="text-[10px] text-amber-500 font-mono ml-2">{card.cmc} CMC</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
