  <!-- JAVASCRIPT APP LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // FIREBASE STATE INITIALIZATION
    let db = null;
    let auth = null;
    let myPlayerId = sessionStorage.getItem('mtg_rotisserie_my_player_id');
    let activeRoomId = null;
    let unsubscribeRoomListener = null;

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'rotisserie-draft-default';

    async function initFirebase() {
      try {
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          const config = JSON.parse(__firebase_config);
          const app = initializeApp(config);
          db = getFirestore(app);
          auth = getAuth(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        }
      } catch (err) {
        console.warn("Firebase initialization skipped or failed, falling back to local session:", err);
      }
    }

    // PRESET CUBES
    const CUBE_PRESETS = {
      classic: [
        "Black Lotus", "Ancestral Recall", "Time Walk", "Mox Sapphire", "Mox Jet", "Mox Ruby", "Mox Emerald", "Mox Pearl",
        "Sol Ring", "Mana Crypt", "Library of Alexandria", "Time Vault", "Channel", "Tinker", "Balance", "Mind Twist",
        "Wheel of Fortune", "Yawgmoth's Will", "Fastbond", "Strip Mine", "Ragavan, Nimble Pilferer", "Urza, Lord High Artificer",
        "Grief", "Fury", "Solitude", "Subtlety", "Endurance", "Minsc & Boo, Timeless Heroes", "The One Ring", "Oko, Thief of Crowns"
      ],
      vintage: [
        "Black Lotus", "Ancestral Recall", "Time Walk", "Mox Sapphire", "Mox Jet", "Mox Ruby", "Mox Emerald", "Mox Pearl",
        "Sol Ring", "Mana Crypt", "Library of Alexandria", "Time Vault", "Channel", "Tinker", "Balance", "Mind Twist",
        "Wheel of Fortune", "Yawgmoth's Will", "Fastbond", "Strip Mine", "Ragavan, Nimble Pilferer", "Urza, Lord High Artificer",
        "Grief", "Fury", "Solitude", "Subtlety", "Endurance", "Minsc & Boo, Timeless Heroes", "Broadside Bombardiers",
        "Orcish Bowmasters", "The One Ring", "Oko, Thief of Crowns", "Teferi, Time Raveler", "Force of Will", "Brainstorm",
        "Swords to Plowshares", "Lightning Bolt", "Thoughtseize", "Demonic Tutor", "Vampiric Tutor", "Reanimate"
      ]
    };

    const LOCAL_STORAGE_KEY = 'mtg_rotisserie_draft_save_v1';

    // STATE MANAGEMENT
    window.appState = {
      players: [],
      cardPool: [],
      draftOrder: [],
      currentPickIndex: 0,
      draftMode: 'snake',
      history: [],
      selectedRosterPlayerIndex: 0,
      activeColorFilters: new Set(),
      filterSearch: '',
      filterType: '',
      viewMode: 'grid',
      poolDisplayMode: 'list',
      poolGrouping: 'type',
      timestamp: null
    };

    window.onload = async function() {
      await initFirebase();
      updatePlayerInputs(4);
      loadPreset('classic');
      
      // Check URL Hash for room join e.g. #room=ROOM_ID
      const hash = window.location.hash;
      if (hash && hash.startsWith('#room=')) {
        const roomId = hash.replace('#room=', '');
        if (roomId) {
          joinDraftRoom(roomId);
          return;
        }
      }
      
      checkForSavedDraft();
    };

    function showErrorAlert(msg) {
      const box = document.getElementById('error-alert');
      document.getElementById('error-alert-msg').innerText = msg;
      box.classList.remove('hidden');
    }

    window.dismissAlert = function() {
      document.getElementById('error-alert').classList.add('hidden');
    };

    // SCRYFALL BATCH FETCHING (/cards/collection)
    async function fetchScryfallBatch(cardNames) {
      const uniqueNames = Array.from(new Set(cardNames));
      const cardMap = {};

      const overlay = document.getElementById('loading-overlay');
      const progressText = document.getElementById('loading-progress-text');
      const barFill = document.getElementById('loading-bar-fill');
      
      document.getElementById('loading-title').innerText = "Fetching Card Data...";
      overlay.classList.remove('hidden');

      const BATCH_SIZE = 75;
      for (let i = 0; i < uniqueNames.length; i += BATCH_SIZE) {
        const chunk = uniqueNames.slice(i, i + BATCH_SIZE);
        const currentCount = Math.min(i + BATCH_SIZE, uniqueNames.length);
        
        progressText.innerText = `Scryfall API: ${currentCount} / ${uniqueNames.length} cards loaded...`;
        if (barFill) barFill.style.width = `${Math.round((currentCount / uniqueNames.length) * 100)}%`;

        try {
          const res = await fetch('https://api.scryfall.com/cards/collection', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifiers: chunk.map(name => ({ name: name })) })
          });

          if (res.ok) {
            const data = await res.json();
            if (data.data) {
              data.data.forEach(scryCard => {
                const parsed = processScryfallCard(scryCard);
                cardMap[scryCard.name.toLowerCase()] = parsed;
                chunk.forEach(reqName => {
                  if (scryCard.name.toLowerCase().includes(reqName.toLowerCase())) {
                    cardMap[reqName.toLowerCase()] = parsed;
                  }
                });
              });
            }
          }
        } catch (err) {
          console.warn('Scryfall batch fetch partial failure:', err);
        }

        await new Promise(r => setTimeout(r, 80));
      }

      overlay.classList.add('hidden');
      return cardMap;
    }

    function processScryfallCard(scry) {
      let img = null;
      if (scry.image_uris && scry.image_uris.normal) {
        img = scry.image_uris.normal;
      } else if (scry.card_faces && scry.card_faces[0].image_uris) {
        img = scry.card_faces[0].image_uris.normal;
      }

      let manaCost = scry.mana_cost || '';
      let oracleText = scry.oracle_text || '';
      let typeLine = scry.type_line || 'Unknown';

      if (scry.card_faces && (!manaCost || !oracleText)) {
        manaCost = manaCost || scry.card_faces.map(f => f.mana_cost).filter(Boolean).join(' // ');
        oracleText = oracleText || scry.card_faces.map(f => `${f.name}: ${f.oracle_text}`).join('\n\n');
        typeLine = typeLine !== 'Unknown' ? typeLine : scry.card_faces[0].type_line;
      }

      return {
        name: scry.name,
        colors: scry.colors || (scry.card_faces ? scry.card_faces[0].colors : []),
        color_identity: scry.color_identity || [],
        cmc: scry.cmc !== undefined ? scry.cmc : 0,
        type: typeLine,
        mana_cost: manaCost,
        image_url: img,
        oracle_text: oracleText
      };
    }

    // START DRAFT & ROOM CREATION
    window.startDraft = async function() {
      try {
        const nameInputs = document.querySelectorAll('.player-name-input');
        const playerNames = Array.from(nameInputs).map((input, idx) => input.value.trim() || `Player ${idx + 1}`);

        const rawCardText = document.getElementById('input-card-pool').value;
        const parsedCardNames = parseCardList(rawCardText);

        if (parsedCardNames.length < playerNames.length) {
          showErrorAlert(`Please enter at least ${playerNames.length} valid cards to draft.`);
          return;
        }

        // Fetch Scryfall Data
        const scryfallMap = await fetchScryfallBatch(parsedCardNames);

        appState.players = playerNames.map((name, index) => ({
          id: index,
          name: name,
          pool: []
        }));

        appState.cardPool = parsedCardNames.map((name, index) => {
          const scryData = scryfallMap[name.toLowerCase()] || {};
          return {
            id: `card-${index}-${Date.now()}`,
            name: scryData.name || name,
            colors: scryData.colors || [],
            color_identity: scryData.color_identity || [],
            cmc: scryData.cmc !== undefined ? scryData.cmc : 0,
            type: scryData.type || 'Unknown',
            mana_cost: scryData.mana_cost || '',
            image_url: scryData.image_url || null,
            oracle_text: scryData.oracle_text || '',
            draftedBy: null
          };
        });

        generateDraftOrder(appState.cardPool.length, playerNames.length);

        appState.currentPickIndex = 0;
        appState.history = [];
        appState.selectedRosterPlayerIndex = 0;

        // Create Room ID
        activeRoomId = 'room-' + Math.random().toString(36).substring(2, 9);
        window.location.hash = `room=${activeRoomId}`;

        await syncRoomToFirebase();
        listenToRoom(activeRoomId);

        document.getElementById('screen-setup').classList.add('hidden');
        document.getElementById('screen-draft').classList.remove('hidden');
        document.getElementById('header-draft-stats').classList.remove('hidden');
        document.getElementById('btn-undo').classList.remove('hidden');
        document.getElementById('btn-share-room').classList.remove('hidden');
        document.getElementById('save-indicator').classList.remove('hidden');
        document.getElementById('identity-bar').classList.remove('hidden');

        updateIdentityUI();
        updateDraftUI();
      } catch (err) {
        console.error("Failed to start draft:", err);
        showErrorAlert("Failed to start draft room: " + err.message);
      }
    };

    async function syncRoomToFirebase() {
      if (!db || !activeRoomId) {
        saveStateToLocalStorage();
        return;
      }
      try {
        appState.timestamp = new Date().toLocaleString();
        const payload = {
          ...appState,
          activeColorFilters: Array.from(appState.activeColorFilters)
        };
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'drafts', activeRoomId);
        await setDoc(roomRef, payload, { merge: true });
      } catch (err) {
        console.warn("Firestore sync write failed, saving locally:", err);
        saveStateToLocalStorage();
      }
    }

    async function joinDraftRoom(roomId) {
      activeRoomId = roomId;
      document.getElementById('loading-title').innerText = "Joining Draft Room...";
      document.getElementById('loading-overlay').classList.remove('hidden');

      if (db) {
        try {
          const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'drafts', roomId);
          const snap = await getDoc(roomRef);
          if (snap.exists()) {
            const data = snap.data();
            appState = {
              ...data,
              activeColorFilters: new Set(data.activeColorFilters || [])
            };
            listenToRoom(roomId);
            transitionToDraftScreen();
          } else {
            showErrorAlert(`Room '${roomId}' not found. Created new setup session.`);
            document.getElementById('loading-overlay').classList.add('hidden');
          }
        } catch (err) {
          console.error("Error joining draft room:", err);
          showErrorAlert("Could not load synced draft room. Loading cached state.");
          document.getElementById('loading-overlay').classList.add('hidden');
        }
      } else {
        document.getElementById('loading-overlay').classList.add('hidden');
      }
    }

    function listenToRoom(roomId) {
      if (!db) return;
      if (unsubscribeRoomListener) unsubscribeRoomListener();

      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'drafts', roomId);
      unsubscribeRoomListener = onSnapshot(roomRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          appState = {
            ...data,
            activeColorFilters: new Set(data.activeColorFilters || [])
          };
          updateIdentityUI();
          updateDraftUI();
        }
      }, (err) => {
        console.warn("Snapshot listener error:", err);
      });
    }

    function transitionToDraftScreen() {
      document.getElementById('loading-overlay').classList.add('hidden');
      document.getElementById('screen-setup').classList.add('hidden');
      document.getElementById('screen-draft').classList.remove('hidden');
      document.getElementById('header-draft-stats').classList.remove('hidden');
      document.getElementById('btn-undo').classList.remove('hidden');
      document.getElementById('btn-share-room').classList.remove('hidden');
      document.getElementById('save-indicator').classList.remove('hidden');
      document.getElementById('identity-bar').classList.remove('hidden');

      updateIdentityUI();
      updateDraftUI();
    }

    window.copyRoomLink = function() {
      const url = window.location.href;
      const dummy = document.createElement("textarea");
      document.body.appendChild(dummy);
      dummy.value = url;
      dummy.select();
      document.execCommand("copy");
      document.body.removeChild(dummy);
      alert("Draft Room Link copied to clipboard! Share this URL with all participants.");
    };

    window.openIdentityModal = function() {
      const list = document.getElementById('identity-seats-list');
      list.innerHTML = '';

      appState.players.forEach(p => {
        const btn = document.createElement('button');
        btn.className = `w-full p-2.5 rounded-xl border text-left text-xs font-semibold transition flex justify-between items-center ${
          myPlayerId == p.id 
            ? 'bg-indigo-600 text-white border-indigo-400' 
            : 'bg-slate-900 border-slate-700 text-slate-200 hover:border-indigo-500'
        }`;
        btn.onclick = () => {
          myPlayerId = p.id;
          sessionStorage.setItem('mtg_rotisserie_my_player_id', myPlayerId);
          updateIdentityUI();
          closeIdentityModal();
          updateDraftUI();
        };
        btn.innerHTML = `<span>${p.name}</span> <span class="text-[10px] font-mono opacity-60">Seat #${p.id + 1}</span>`;
        list.appendChild(btn);
      });

      document.getElementById('identity-modal').classList.remove('hidden');
    };

    window.closeIdentityModal = function() {
      document.getElementById('identity-modal').classList.add('hidden');
    };

    function updateIdentityUI() {
      const label = document.getElementById('current-identity-name');
      if (myPlayerId !== null && appState.players[myPlayerId]) {
        label.innerText = appState.players[myPlayerId].name;
      } else {
        label.innerText = 'Unclaimed / Spectator';
      }
    }

    function saveStateToLocalStorage() {
      try {
        appState.timestamp = new Date().toLocaleString();
        const serializedState = {
          ...appState,
          activeColorFilters: Array.from(appState.activeColorFilters)
        };
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(serializedState));
      } catch (err) {
        console.warn("Local storage write error:", err);
      }
    }

    function generateDraftOrder(totalCards, numPlayers) {
      appState.draftOrder = [];
      let round = 0;
      while (appState.draftOrder.length < totalCards) {
        if (appState.draftMode === 'snake' && round % 2 === 1) {
          for (let p = numPlayers - 1; p >= 0; p--) {
            if (appState.draftOrder.length < totalCards) appState.draftOrder.push(p);
          }
        } else {
          for (let p = 0; p < numPlayers; p++) {
            if (appState.draftOrder.length < totalCards) appState.draftOrder.push(p);
          }
        }
        round++;
      }
    }

    window.executePick = async function(cardId) {
      const card = appState.cardPool.find(c => c.id === cardId);
      if (!card || card.draftedBy !== null) return;

      const activePlayerIndex = appState.draftOrder[appState.currentPickIndex];
      const activePlayer = appState.players[activePlayerIndex];

      // Turn Lock Enforcement
      if (myPlayerId !== null && parseInt(myPlayerId) !== activePlayerIndex) {
        alert(`It is currently ${activePlayer.name}'s pick turn.`);
        return;
      }

      card.draftedBy = activePlayerIndex;
      activePlayer.pool.push(card);

      appState.history.push({
        pickIndex: appState.currentPickIndex,
        cardId: card.id,
        playerIndex: activePlayerIndex
      });

      addLogEntry(`${activePlayer.name} picked <strong>${card.name}</strong>`);
      closePickModal();

      appState.currentPickIndex++;

      if (appState.currentPickIndex < appState.draftOrder.length) {
        appState.selectedRosterPlayerIndex = appState.draftOrder[appState.currentPickIndex];
      }

      await syncRoomToFirebase();

      if (appState.currentPickIndex >= appState.draftOrder.length) {
        finishDraft();
      } else {
        updateDraftUI();
      }
    };

    window.undoLastPick = async function() {
      if (appState.history.length === 0) return;

      const lastPick = appState.history.pop();
      const card = appState.cardPool.find(c => c.id === lastPick.cardId);
      const player = appState.players[lastPick.playerIndex];

      if (card && player) {
        card.draftedBy = null;
        player.pool = player.pool.filter(c => c.id !== card.id);
        appState.currentPickIndex = lastPick.pickIndex;

        addLogEntry(`Undid pick: <em>${card.name}</em>`, true);
        appState.selectedRosterPlayerIndex = appState.draftOrder[appState.currentPickIndex];

        await syncRoomToFirebase();
        updateDraftUI();
      }
    };

  </script>
