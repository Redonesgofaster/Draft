<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shandalar Rotisserie Draft Engine</title>
  
  <!-- Tailwind CSS & React -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Shandalar Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=MedievalSharp&display=swap" rel="stylesheet">

  <style>
    .font-shandalar { font-family: 'Cinzel', serif; }
    .font-parchment { font-family: 'MedievalSharp', cursive; }

    .bg-shandalar-wood {
      background: #0d0907;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(180, 83, 9, 0.25), transparent 75%),
        radial-gradient(circle at 10% 90%, rgba(30, 27, 75, 0.4), transparent 50%),
        linear-gradient(to bottom, #18100b, #090604);
    }

    .bg-parchment {
      background: #e2d1a6;
      background-image: radial-gradient(circle at 50% 50%, #eee3c3, #cbb685);
      color: #261708;
      box-shadow: 0 0 25px rgba(0,0,0,0.9), inset 0 0 15px rgba(100,60,20,0.4);
      border: 3px solid #854d0e;
    }

    .gold-border {
      border: 2px solid #b45309;
      box-shadow: 0 0 12px rgba(180, 83, 9, 0.35), inset 0 0 10px rgba(0,0,0,0.8);
    }

    .gold-text-glow {
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.6), 0 0 20px rgba(180, 83, 9, 0.4);
    }

    .mana-orb {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 900;
      font-size: 11px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.6), 0 0 6px currentColor;
    }
    .mana-w { background: radial-gradient(circle at 35% 35%, #fffbeb, #fef08a, #ca8a04); color: #713f12; }
    .mana-u { background: radial-gradient(circle at 35% 35%, #e0f2fe, #38bdf8, #0369a1); color: #0c4a6e; }
    .mana-b { background: radial-gradient(circle at 35% 35%, #475569, #1e293b, #020617); color: #f8fafc; }
    .mana-r { background: radial-gradient(circle at 35% 35%, #fef2f2, #ef4444, #991b1b); color: #450a0a; }
    .mana-g { background: radial-gradient(circle at 35% 35%, #f0fdf4, #4ade80, #15803d); color: #052e16; }

    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #0f0b08; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #b45309; border-radius: 4px; }
  </style>
</head>
<body class="bg-shandalar-wood text-amber-100 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <!-- Firebase Modular JS SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.firestoreTools = { doc, setDoc, onSnapshot };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // SVG Graphics
    const SparklesIcon = () => (
      <svg className="w-6 h-6 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
    );
    const UploadIcon = () => (
      <svg className="w-8 h-8 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
    );
    const UserIcon = () => (
      <svg className="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
    );
    const ScrollIcon = () => (
      <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
    );
    const LockIcon = () => (
      <svg className="w-6 h-6 text-amber-600/60 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    );

    function parseCsvLine(text) {
      const result = [];
      let cell = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cell.trim().replace(/^"|"$/g, ''));
          cell = '';
        } else {
          cell += c;
        }
      }
      result.push(cell.trim().replace(/^"|"$/g, ''));
      return result;
    }

    function cleanCardName(rawName) {
      if (!rawName) return "";
      let name = rawName.trim().replace(/\s\([A-Z0-9]+\)\s?\d*/g, "");
      if (name.includes("/") && !name.includes("//")) {
        name = name.replace(/\s*\/\s*/g, " // ");
      }
      return name;
    }

    async function fetchScryfallBatch(cardNames) {
      const cleanedNames = cardNames.map(cleanCardName).filter(n => n.length > 0);
      const uniqueNames = Array.from(new Set(cleanedNames));
      
      const chunks = [];
      for (let i = 0; i < uniqueNames.length; i += 50) {
        chunks.push(uniqueNames.slice(i, i + 50));
      }

      const map = {};
      const missingNames = [];

      for (const chunk of chunks) {
        try {
          const res = await fetch("https://api.scryfall.com/cards/collection", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identifiers: chunk.map(name => ({ name })) })
          });
          const json = await res.json();
          
          if (json.data) {
            json.data.forEach(card => {
              const img = card.image_uris?.normal || 
                          card.card_faces?.[0]?.image_uris?.normal || 
                          "https://cards.scryfall.io/back.png";
              
              const entry = {
                id: card.id,
                name: card.name,
                image: img,
                cmc: card.cmc ?? 0,
                colors: card.colors || (card.card_faces?.[0]?.colors) || ["C"],
                type: card.type_line || "Card"
              };

              map[card.name.toLowerCase()] = entry;
              chunk.forEach(reqName => {
                if (reqName.toLowerCase().includes(card.name.toLowerCase()) || card.name.toLowerCase().includes(reqName.toLowerCase())) {
                  map[reqName.toLowerCase()] = entry;
                }
              });
            });
          }

          if (json.not_found) {
            json.not_found.forEach(nf => {
              if (nf.name) missingNames.push(nf.name);
            });
          }
          await new Promise(r => setTimeout(r, 120));
        } catch (err) {}
      }

      for (const missingName of missingNames) {
        try {
          const res = await fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(missingName)}`);
          if (res.ok) {
            const card = await res.json();
            const img = card.image_uris?.normal || card.card_faces?.[0]?.image_uris?.normal || "https://cards.scryfall.io/back.png";
            map[missingName.toLowerCase()] = {
              id: card.id,
              name: card.name,
              image: img,
              cmc: card.cmc ?? 0,
              colors: card.colors || (card.card_faces?.[0]?.colors) || ["C"],
              type: card.type_line || "Card"
            };
          }
          await new Promise(r => setTimeout(r, 100));
        } catch (e) {}
      }

      return map;
    }

    function generateRotisseriePickSequence(numPlayers, totalCap, doublePickStartPick) {
      const sequence = [];
      let forward = true;
      let currentSeat = 0;

      while (sequence.length < totalCap) {
        const pickNumber = sequence.length + 1;
        const picksAllowedThisTurn = (doublePickStartPick > 0 && pickNumber > doublePickStartPick) ? 2 : 1;

        for (let p = 0; p < picksAllowedThisTurn; p++) {
          if (sequence.length < totalCap) {
            sequence.push(currentSeat);
          }
        }

        if (forward) {
          if (currentSeat === numPlayers - 1) {
            forward = false;
          } else {
            currentSeat++;
          }
        } else {
          if (currentSeat === 0) {
            forward = true;
          } else {
            currentSeat--;
          }
        }
      }
      return sequence;
    }

    function generateRoomId() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    // DISCORD IN-PLACE EDITING WEBHOOK NOTIFIER
    async function sendOrUpdateDiscordTurnNotification(webhookUrl, draftState, previousPickLog) {
      if (!webhookUrl || !webhookUrl.startsWith("https://discord.com/api/webhooks/")) return null;

      const activeSeat = draftState.pickSequence[draftState.currentPickIndex];
      const activePlayer = draftState.players[activeSeat];
      const currentPickNumber = draftState.currentPickIndex + 1;
      const roomUrl = `${window.location.origin}${window.location.pathname}#${draftState.roomId}`;

      const lastPick = previousPickLog?.[0];
      const lastPickText = lastPick 
        ? `**${lastPick.player}** drafted **${lastPick.card}**` 
        : "The Rotisserie Draft has officially begun!";

      const embedPayload = {
        username: "Shandalar Draft Master",
        avatar_url: "https://cards.scryfall.io/back.png",
        embeds: [
          {
            title: draftState.isFinished ? `🎉 Rotisserie Draft Complete!` : `🔮 Turn: ${activePlayer.name}`,
            url: roomUrl,
            description: draftState.isFinished 
              ? `All **${draftState.totalCap}** picks have been made! Check your final deck pools.`
              : `It is currently **${activePlayer.name}'s** turn to pick!\n\n📜 **Last Action:** ${lastPickText}`,
            color: draftState.isFinished ? 3066993 : 15111189,
            fields: [
              {
                name: "Draft Progress",
                value: `Pick **${Math.min(currentPickNumber, draftState.totalCap)}** of **${draftState.totalCap}**`,
                inline: true
              },
              {
                name: "Direct Room Link",
                value: `[👉 Join Room #${draftState.roomId}](${roomUrl})`,
                inline: true
              }
            ],
            footer: {
              text: "Shandalar Rotisserie Draft Engine • Live Sync"
            },
            timestamp: new Date().toISOString()
          }
        ]
      };

      try {
        if (draftState.discordMessageId) {
          const patchUrl = `${webhookUrl}/messages/${draftState.discordMessageId}`;
          const res = await fetch(patchUrl, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(embedPayload)
          });
          if (res.ok) return draftState.discordMessageId;
        }

        const postUrl = `${webhookUrl}?wait=true`;
        const res = await fetch(postUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(embedPayload)
        });
        if (res.ok) {
          const json = await res.json();
          return json.id;
        }
      } catch (err) {
        console.error("Discord Webhook Error:", err);
      }
      return null;
    }

    function App() {
      const [parsedPool, setParsedPool] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [numPlayers, setNumPlayers] = useState(4);
      const [packPreset, setPackPreset] = useState("3x15");
      const [doublePickStart, setDoublePickStart] = useState(20);
      const [discordWebhook, setDiscordWebhook] = useState("");
      const [playerNames, setPlayerNames] = useState(
        Array.from({ length: 4 }, (_, i) => `Drafter ${i + 1}`)
      );

      const [roomId, setRoomId] = useState("");
      const [draftState, setDraftState] = useState(null);
      const [mySeat, setMySeat] = useState(null);
      const [hasChosenSeat, setHasChosenSeat] = useState(false);
      const [copiedLink, setCopiedLink] = useState(false);
      const [showLogDrawer, setShowLogDrawer] = useState(false);
      const [activeMobilePopoverCardId, setActiveMobilePopoverCardId] = useState(null);
      
      const [pendingPickCard, setPendingPickCard] = useState(null);

      const [searchTerm, setSearchTerm] = useState("");
      const [colorFilter, setColorFilter] = useState("ALL");
      const [sortBy, setSortBy] = useState("NAME");
      const [displayStyle, setDisplayStyle] = useState("GRID");
      const [viewTab, setViewTab] = useState("pool");

      const draftStateRef = useRef(draftState);
      useEffect(() => {
        draftStateRef.current = draftState;
      }, [draftState]);

      // Hash Listener & Dynamic LocalStorage Seat Recovery
      useEffect(() => {
        const updateFromHash = () => {
          const hash = window.location.hash.replace("#", "").trim();
          if (hash.length > 0 && window.db) {
            setRoomId(hash);

            // Read LocalStorage for saved seat corresponding to this specific room ID
            const savedSeat = localStorage.getItem(`shandalar_seat_${hash}`);
            if (savedSeat !== null && savedSeat !== "") {
              const parsedSeat = parseInt(savedSeat, 10);
              if (!isNaN(parsedSeat)) {
                setMySeat(parsedSeat);
                setHasChosenSeat(true);
              }
            } else {
              setHasChosenSeat(false);
              setMySeat(null);
            }

            const { doc, onSnapshot } = window.firestoreTools;
            const unsub = onSnapshot(doc(window.db, "drafts", hash), (docSnap) => {
              if (docSnap.exists()) {
                const data = docSnap.data();
                setDraftState(data);
              }
            });
            return unsub;
          }
        };

        const unsubFn = updateFromHash();
        window.addEventListener("hashchange", updateFromHash);
        return () => {
          if (unsubFn) unsubFn();
          window.removeEventListener("hashchange", updateFromHash);
        };
      }, [window.db]);

      // Assign and persist seat selection to localStorage
      const chooseSeat = (seatIndex) => {
        setMySeat(seatIndex);
        setHasChosenSeat(true);
        const activeRoom = roomId || window.location.hash.replace("#", "").trim();
        if (activeRoom) {
          if (seatIndex !== null) {
            localStorage.setItem(`shandalar_seat_${activeRoom}`, seatIndex.toString());
          } else {
            localStorage.removeItem(`shandalar_seat_${activeRoom}`);
          }
        }
      };

      // Trigger automatic turn execution & Single Message Discord In-Place Update
      useEffect(() => {
        if (!draftState) return;

        const processWebhookAndAutoDraft = async () => {
          if (draftState.discordWebhook && draftState.lastNotifiedPick !== draftState.currentPickIndex) {
            const messageId = await sendOrUpdateDiscordTurnNotification(draftState.discordWebhook, draftState, draftState.pickLog);
            if (messageId) {
              const updatedState = { 
                ...draftState, 
                discordMessageId: messageId, 
                lastNotifiedPick: draftState.currentPickIndex 
              };
              syncStateToFirestore(updatedState);
            }
          }

          if (draftState.isFinished) return;
          const activeSeat = draftState.pickSequence[draftState.currentPickIndex];
          const activePlayer = draftState.players[activeSeat];

          // Re-validate that queued card is STILL present in availablePool before drafting
          if (activePlayer && activePlayer.autoDraft && activePlayer.queue.length > 0) {
            const topQueuedId = activePlayer.queue.find(id => 
              draftState.availablePool.some(c => c.uniqueId === id)
            );
            if (topQueuedId) {
              const cardToPick = draftState.availablePool.find(c => c.uniqueId === topQueuedId);
              if (cardToPick) {
                setTimeout(() => executePick(cardToPick, activeSeat), 100);
              }
            }
          }
        };

        processWebhookAndAutoDraft();
      }, [draftState?.currentPickIndex, draftState?.players]);

      useEffect(() => {
        setPlayerNames(prev => {
          if (prev.length === numPlayers) return prev;
          if (prev.length < numPlayers) {
            const added = Array.from({ length: numPlayers - prev.length }, (_, i) => `Drafter ${prev.length + i + 1}`);
            return [...prev, ...added];
          }
          return prev.slice(0, numPlayers);
        });
      }, [numPlayers]);

      const handleCsvUpload = async (file) => {
        if (!file) return;
        setIsLoading(true);
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
        const names = [];
        
        lines.forEach((line, idx) => {
          if (idx === 0 && line.toLowerCase().includes("name")) return;
          const parts = parseCsvLine(line);
          let name = parts[0]?.trim();
          if (name) names.push(name);
        });

        const fetchedMap = await fetchScryfallBatch(names);
        
        const cardList = names.map((rawName, index) => {
          const cleaned = cleanCardName(rawName);
          const fetched = fetchedMap[cleaned.toLowerCase()] || fetchedMap[rawName.toLowerCase()];
          return fetched ? { ...fetched, uniqueId: `${fetched.id}-${index}` } : {
            uniqueId: `custom-${index}`,
            name: rawName,
            image: "https://cards.scryfall.io/back.png",
            cmc: 0,
            colors: ["C"],
            type: "Card"
          };
        });

        setParsedPool(cardList);
        setIsLoading(false);
      };

      const calculatedTotalCap = useMemo(() => {
        if (!parsedPool.length) return 0;
        if (packPreset === "3x15") return Math.min(parsedPool.length, numPlayers * 45);
        if (packPreset === "4x11") return Math.min(parsedPool.length, numPlayers * 44);
        if (packPreset === "4x15") return Math.min(parsedPool.length, numPlayers * 60);
        return parsedPool.length;
      }, [parsedPool.length, numPlayers, packPreset]);

      const startDraft = async () => {
        if (parsedPool.length === 0) return;

        const newRoomId = generateRoomId();
        const players = playerNames.map((name, i) => ({
          id: i,
          name: name || `Drafter ${i + 1}`,
          pool: [],
          queue: [],
          autoDraft: false
        }));

        const pickSequence = generateRotisseriePickSequence(numPlayers, calculatedTotalCap, doublePickStart);

        const newSession = {
          roomId: newRoomId,
          players,
          availablePool: parsedPool,
          pickSequence,
          currentPickIndex: 0,
          totalCap: calculatedTotalCap,
          doublePickStart: doublePickStart,
          discordWebhook: discordWebhook.trim(),
          discordMessageId: null,
          lastNotifiedPick: -1,
          pickLog: []
        };

        setRoomId(newRoomId);
        window.location.hash = newRoomId;

        if (window.db) {
          const { doc, setDoc } = window.firestoreTools;
          await setDoc(doc(window.db, "drafts", newRoomId), newSession);
        }

        setDraftState(newSession);
        chooseSeat(0); // Host defaults to Seat 1
      };

      const syncStateToFirestore = async (newState) => {
        if (window.db && roomId) {
          const { doc, setDoc } = window.firestoreTools;
          await setDoc(doc(window.db, "drafts", roomId), newState);
        }
      };

      // Atomic Execution & Duplicate Pick Prevention
      const executePick = (card, seatIdx) => {
        const currentState = draftStateRef.current || draftState;
        if (!currentState) return;

        const activeSeat = currentState.pickSequence[currentState.currentPickIndex];
        if (seatIdx !== undefined && seatIdx !== activeSeat) return;

        // Atomically verify card still exists in pool to eliminate race conditions
        const cardStillAvailable = currentState.availablePool.some(c => c.uniqueId === card.uniqueId);
        if (!cardStillAvailable) {
          console.warn("Card already drafted by another player:", card.name);
          setPendingPickCard(null);
          return;
        }

        const updatedPlayers = currentState.players.map((p, idx) => {
          if (idx === activeSeat) {
            return {
              ...p,
              pool: [...p.pool, card],
              queue: p.queue.filter(id => id !== card.uniqueId)
            };
          }
          // Remove card from all other player queues if present
          return {
            ...p,
            queue: p.queue.filter(id => id !== card.uniqueId)
          };
        });

        const updatedAvailablePool = currentState.availablePool.filter(c => c.uniqueId !== card.uniqueId);
        const nextPickIndex = currentState.currentPickIndex + 1;
        const targetPlayer = currentState.players[activeSeat];
        const newLog = [{ player: targetPlayer.name, card: card.name, pick: nextPickIndex }, ...currentState.pickLog];

        let nextState = {
          ...currentState,
          players: updatedPlayers,
          availablePool: updatedAvailablePool,
          currentPickIndex: nextPickIndex,
          pickLog: newLog,
          isFinished: nextPickIndex >= currentState.pickSequence.length || updatedAvailablePool.length === 0
        };

        setDraftState(nextState);
        setPendingPickCard(null);
        syncStateToFirestore(nextState);
      };

      const toggleQueue = (cardId) => {
        if (mySeat === null || !draftState) return;
        const updatedPlayers = [...draftState.players];
        const player = updatedPlayers[mySeat];
        
        if (player.queue.includes(cardId)) {
          player.queue = player.queue.filter(id => id !== cardId);
        } else {
          player.queue.push(cardId);
        }

        const nextState = { ...draftState, players: updatedPlayers };
        setDraftState(nextState);
        syncStateToFirestore(nextState);
      };

      const moveQueuePriority = (index, direction) => {
        if (mySeat === null || !draftState) return;
        const updatedPlayers = [...draftState.players];
        const queue = [...updatedPlayers[mySeat].queue];

        const targetIndex = direction === "UP" ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= queue.length) return;

        const temp = queue[index];
        queue[index] = queue[targetIndex];
        queue[targetIndex] = temp;

        updatedPlayers[mySeat].queue = queue;
        const nextState = { ...draftState, players: updatedPlayers };
        setDraftState(nextState);
        syncStateToFirestore(nextState);
      };

      const toggleAutoDraft = () => {
        if (mySeat === null || !draftState) return;
        const updatedPlayers = [...draftState.players];
        const player = updatedPlayers[mySeat];
        const newAutoDraftState = !player.autoDraft;
        player.autoDraft = newAutoDraftState;

        const nextState = { ...draftState, players: updatedPlayers };
        setDraftState(nextState);
        syncStateToFirestore(nextState);

        const activeSeat = nextState.pickSequence[nextState.currentPickIndex];
        if (newAutoDraftState && mySeat === activeSeat && player.queue.length > 0) {
          const topQueuedId = player.queue.find(id => nextState.availablePool.some(c => c.uniqueId === id));
          if (topQueuedId) {
            const cardToPick = nextState.availablePool.find(c => c.uniqueId === topQueuedId);
            if (cardToPick) {
              executePick(cardToPick, mySeat);
            }
          }
        }
      };

      const copyShareableLink = () => {
        navigator.clipboard.writeText(window.location.href);
        setCopiedLink(true);
        setTimeout(() => setCopiedLink(false), 2000);
      };

      const filteredPool = useMemo(() => {
        if (!draftState) return [];
        let pool = draftState.availablePool.filter(card => {
          const matchesSearch = card.name.toLowerCase().includes(searchTerm.toLowerCase());
          let matchesColor = true;
          if (colorFilter === "C") matchesColor = card.colors.length === 0 || card.colors.includes("C");
          else if (colorFilter === "M") matchesColor = card.colors.length > 1;
          else if (colorFilter !== "ALL") matchesColor = card.colors.includes(colorFilter);
          return matchesSearch && matchesColor;
        });

        return pool.sort((a, b) => {
          if (sortBy === "NAME") return a.name.localeCompare(b.name);
          if (sortBy === "CMC_ASC") return a.cmc - b.cmc || a.name.localeCompare(b.name);
          if (sortBy === "CMC_DESC") return b.cmc - a.cmc || a.name.localeCompare(b.name);
          if (sortBy === "COLOR") return (a.colors[0] || "Z").localeCompare(b.colors[0] || "Z") || a.name.localeCompare(b.name);
          return 0;
        });
      }, [draftState?.availablePool, searchTerm, colorFilter, sortBy]);

      const activeSeat = draftState && !draftState.isFinished ? draftState.pickSequence[draftState.currentPickIndex] : null;
      const activePlayer = activeSeat !== null ? draftState.players[activeSeat] : null;
      const isMyTurn = mySeat !== null && mySeat === activeSeat;

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-6 min-h-screen flex flex-col relative">
          
          {/* SEAT SELECTION MODAL */}

              <div className="bg-parchment rounded-2xl p-6 md:p-8 max-w-lg w-full text-center relative shadow-2xl">

                  <UserIcon />
                </div>
                <h2 className="text-2xl font-black font-shandalar text-amber-950 gold-text-glow mb-1">

                <p className="text-xs font-parchment text-amber-900/80 mb-6">

                </p>

                <div className="grid grid-cols-2 gap-2.5 mb-6 max-h-60 overflow-y-auto pr-1 custom-scroll">
                  {draftState.players.map((p, idx) => (
                    <button
                      key={p.id}
                      onClick={() => chooseSeat(idx)}
                      className="p-3.5 rounded-xl bg-amber-950/90 border border-amber-700/80 hover:border-amber-400 text-amber-100 font-bold text-sm flex items-center justify-between transition hover:-translate-y-0.5 shadow"
                    >
                      <span className="truncate">{p.name}</span>
                      <span className="text-xs text-amber-400 font-mono">Seat {idx + 1}</span>
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => chooseSeat(null)}
                  className="w-full py-3 bg-amber-900 hover:bg-amber-800 text-amber-100 font-bold text-sm rounded-xl border border-amber-700 transition"
                >
                  Enter as Spectator (Observer Mode)
                </button>
              </div>
            </div>
          )}

          {/* PICK CONFIRMATION MODAL */}
          {pendingPickCard && (
            <div className="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4 backdrop-blur-md">
              <div className="bg-parchment rounded-2xl p-6 max-w-sm w-full text-center relative shadow-2xl border-2 border-amber-800 gold-border">
                <h3 className="text-lg font-black font-shandalar text-amber-950 mb-1">

                <p className="text-xs font-parchment text-amber-900/80 mb-4">

                  <img src={pendingPickCard.image} alt={pendingPickCard.name} className="w-full h-auto" />
                </div>

                <div className="text-sm font-bold text-amber-950 mb-4 font-shandalar">
                  {pendingPickCard.name}
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button
                    onClick={() => setPendingPickCard(null)}
                    className="py-2.5 bg-slate-900 hover:bg-slate-800 text-amber-200 font-bold text-xs rounded-xl border border-amber-900 transition"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => executePick(pendingPickCard, mySeat)}
                    className="py-2.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-black font-shandalar text-xs rounded-xl shadow-lg transition"

                    Yes, Draft Card!
                  </button>
                </div>
              </div>
            </div>

          <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-4 border-b-2 border-amber-900/60">
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-3xl font-black font-shandalar text-amber-400 gold-text-glow flex items-center gap-2">

                <div className="hidden sm:flex items-center gap-1 ml-2">
                  <span className="mana-orb mana-w">W</span>
                  <span className="mana-orb mana-u">U</span>
                  <span className="mana-orb mana-b">B</span>
                  <span className="mana-orb mana-r">R</span>
                  <span className="mana-orb mana-g">G</span>
                </div>
              </div>
              <p className="text-xs font-parchment text-amber-200/70 mt-1">Asynchronous Open Pool Magic Drafting</p>
            </div>

            {draftState && (
              <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                <button
                  onClick={copyShareableLink}
                  className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded-lg text-xs transition shadow-lg flex items-center gap-1"

              <div className="bg-slate-950/90 border-2 border-amber-800/80 rounded-2xl p-4 shadow-2xl backdrop-blur">
                <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-b border-amber-900/50 pb-4 mb-4">
                  <div className="flex items-center gap-3">
                    <div className="w-3.5 h-3.5 rounded-full bg-amber-500 animate-pulse shadow-lg"></div>
                    <div>
                      <span className="text-[10px] font-bold text-amber-500 uppercase tracking-widest block font-shandalar">Active Drafter</span>
                      {!draftState.isFinished ? (
                        <div className="text-xl font-black text-amber-200 flex items-center gap-2">
                          <span>{activePlayer?.name}</span>
                          <span className="text-xs bg-amber-950 border border-amber-700/60 px-2 py-0.5 rounded text-amber-400 font-normal">
                            Pick {draftState.currentPickIndex + 1} / {draftState.totalCap}
                          </span>
                          {draftState.doublePickStart > 0 && (draftState.currentPickIndex + 1) > draftState.doublePickStart && (
                            <span className="text-[10px] bg-indigo-950 text-indigo-300 border border-indigo-700 px-2 py-0.5 rounded font-bold">
                              ⚡ Double Pick Active
                            </span>
                          )}
                        </div>
                      ) : (
                        <div className="text-emerald-400 font-bold text-lg">
                          🎉 Rotisserie Draft Complete!
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="text-xs text-amber-400 font-bold bg-slate-900 border border-amber-900/50 px-3 py-1.5 rounded-lg flex items-center gap-2">
                    <UserIcon /> Active Seat: <span className="text-amber-200">{mySeat !== null ? draftState.players[mySeat].name : "Spectator Mode"}</span>
                  </div>
                </div>

                {mySeat !== null && (
                  <div className="flex flex-wrap items-center justify-between gap-3 bg-amber-950/20 p-3 rounded-xl border border-amber-900/40">
                    <div className="flex items-center gap-3">
                      <span className="text-xs font-bold text-amber-300 font-shandalar">Seat Controls ({draftState.players[mySeat].name}):</span>
                      <button
                        onClick={toggleAutoDraft}
                        className={`px-4 py-2 rounded-full text-xs font-bold transition ${
                          draftState.players[mySeat].autoDraft 
                            ? "bg-emerald-500 text-slate-950 shadow-lg" 
                            : "bg-slate-900 text-slate-400 border border-slate-700"

                      >
                        Auto-Draft: {draftState.players[mySeat].autoDraft ? "ON" : "OFF"}
                      </button>
                    </div>

                    <div className="text-xs text-amber-200/70">
                      Queued Cards: <span className="font-bold text-amber-400">{draftState.players[mySeat].queue.length}</span>
                    </div>
                  </div>
                )}
              </div>

              {/* Sub-Nav Toolbar */}
              <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-3 border-b border-amber-900/50 pb-3">
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setViewTab("pool")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold font-shandalar transition ${
                      viewTab === "pool" ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-amber-300 hover:bg-slate-800"
                    }`}
                  >
                    Open Pool ({filteredPool.length})
                  </button>
                  <button
                    onClick={() => setViewTab("queues")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold font-shandalar transition ${
                      viewTab === "queues" ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-amber-300 hover:bg-slate-800"
                    }`}
                  >
                    Queues
                  </button>
                  <button
                    onClick={() => setViewTab("pools")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold font-shandalar transition ${
                      viewTab === "pools" ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-amber-300 hover:bg-slate-800"
                    }`}
                  >
                    Drafted Pools
                  </button>
                </div>

                {viewTab === "pool" && (
                  <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                    <div className="flex border border-amber-900/60 rounded-lg overflow-hidden bg-slate-950">
                      <button
                        onClick={() => setDisplayStyle("GRID")}
                        className={`px-3 py-1.5 text-xs font-bold transition ${
                          displayStyle === "GRID" ? "bg-amber-600 text-slate-950" : "text-amber-300 hover:bg-slate-800"
                        }`}
                      >
                        Grid
                      </button>
                      <button
                        onClick={() => setDisplayStyle("LIST")}
                        className={`px-3 py-1.5 text-xs font-bold transition ${
                          displayStyle === "LIST" ? "bg-amber-600 text-slate-950" : "text-amber-300 hover:bg-slate-800"
                        }`}
                      >
                        List
                      </button>
                    </div>

                    <select
                      value={sortBy}
                      onChange={e => setSortBy(e.target.value)}
                      className="bg-slate-950 border border-amber-900/60 rounded-lg px-2.5 py-1.5 text-xs text-amber-300 font-bold focus:border-amber-400 outline-none"
                    >
                      <option value="NAME">Sort: Name (A-Z)</option>
                      <option value="CMC_ASC">Sort: Mana Value (Low-High)</option>
                      <option value="CMC_DESC">Sort: Mana Value (High-Low)</option>
                      <option value="COLOR">Sort: Color</option>
                    </select>

                    <select
                      value={colorFilter}
                      onChange={e => setColorFilter(e.target.value)}
                      className="bg-slate-950 border border-amber-900/60 rounded-lg px-2.5 py-1.5 text-xs text-amber-300 font-bold focus:border-amber-400 outline-none"
                    >
                      <option value="ALL">All Colors</option>
                      <option value="W">White</option>
                      <option value="U">Blue</option>
                      <option value="B">Black</option>

                      <option value="G">Green</option>
                      <option value="M">Multicolor</option>

                    </select>

                    <input
                      type="text"
                      placeholder="Search card..."

                      onChange={e => setSearchTerm(e.target.value)}

              {/* TAB 1: OPEN POOL */}

                                />
                                <div className="text-[10px] text-center text-amber-300 font-bold mt-1">
                                  {card.name} ({card.cmc} CMC)
                                </div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}

              {/* TAB 2: PRIVATE QUEUES */}
              {viewTab === "queues" && (
                <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
                  {draftState.players.map(player => {
                    const isMyQueue = mySeat === player.id;

                    return (
                      <div key={player.id} className="bg-slate-950/80 border border-amber-900/60 rounded-xl p-4 flex flex-col min-h-[300px]">
                        <div className="flex items-center justify-between border-b border-amber-900/40 pb-2 mb-3">
                          <span className="font-bold text-amber-300 font-shandalar text-sm">{player.name}</span>
                          {isMyQueue && player.autoDraft && (
                            <span className="text-[10px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-700 font-bold">
                              Auto-Draft ON
                            </span>
                          )}
                        </div>

                        {isMyQueue ? (
                          <div className="space-y-2 flex-1 overflow-y-auto max-h-[60vh] pr-1 custom-scroll">
                            {player.queue.length > 0 ? (
                              player.queue.map((cardId, index) => {
                                const card = draftState.availablePool.find(c => c.uniqueId === cardId);
                                if (!card) return null;
                                return (
                                  <div key={cardId} className="flex items-center justify-between bg-slate-900 p-2.5 rounded-lg border border-amber-900/30 text-xs gap-2">
                                    <div className="flex items-center gap-1.5 truncate">
                                      <span className="text-amber-500 font-bold font-mono w-4">{index + 1}.</span>
                                      <span className="text-amber-200 truncate font-medium">{card.name}</span>
                                    </div>
                                    <div className="flex items-center gap-1.5 shrink-0">
                                      <button 
                                        onClick={() => moveQueuePriority(index, "UP")}
                                        disabled={index === 0}
                                        className="w-7 h-7 flex items-center justify-center bg-amber-950 border border-amber-700 text-amber-300 rounded-md hover:bg-amber-800 disabled:opacity-20 text-xs"
                                        title="Move Higher Priority"
                                      >
                                        ▲
                                      </button>
                                      <button 
                                        onClick={() => moveQueuePriority(index, "DOWN")}
                                        disabled={index === player.queue.length - 1}
                                        className="w-7 h-7 flex items-center justify-center bg-amber-950 border border-amber-700 text-amber-300 rounded-md hover:bg-amber-800 disabled:opacity-20 text-xs"
                                        title="Move Lower Priority"
                                      >
                                        ▼
                                      </button>
                                      <button 
                                        onClick={() => toggleQueue(cardId)} 
                                        className="text-rose-400 hover:text-rose-300 font-bold ml-1 text-base px-1"
                                        title="Remove Card"
                                      >
                                        ×
                                      </button>
                                    </div>
                                  </div>
                                );
                              })
                            ) : (
                              <span className="text-xs text-amber-700 italic">No cards in queue. Add cards from the Open Pool.</span>
                            )}
                          </div>
                        ) : (
                          <div className="flex-1 flex flex-col items-center justify-center p-6 text-center border border-dashed border-amber-900/40 rounded-xl bg-slate-900/40">
                            <LockIcon />
                            <span className="text-xs font-bold text-amber-400 font-shandalar block mt-1">Secret Queue</span>
                            <span className="text-[11px] text-amber-200/50 mt-1 block">
                              {player.queue.length} card{player.queue.length === 1 ? '' : 's'} queued
                            </span>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              {/* TAB 3: DRAFTED POOLS */}
              {viewTab === "pools" && (
                <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
                  {draftState.players.map(player => (
                    <div key={player.id} className="bg-slate-950/80 border border-amber-900/60 rounded-xl p-4 flex flex-col">
                      <div className="flex items-center justify-between border-b border-amber-900/40 pb-2 mb-3">
                        <span className="font-bold text-amber-300 font-shandalar text-sm">{player.name}</span>
                        <span className="text-xs text-amber-500 font-bold">{player.pool.length} Cards</span>
                      </div>

                      <div className="space-y-1.5 flex-1 overflow-y-auto max-h-[60vh] pr-1 custom-scroll">
                        {player.pool.map((card, idx) => (
                          <div key={card.uniqueId} className="flex items-center justify-between bg-slate-900/80 px-2.5 py-1.5 rounded text-xs text-amber-100">
                            <span className="truncate">{idx + 1}. {card.name}</span>
                            <span className="text-[10px] text-amber-500 font-mono ml-2">{card.cmc} CMC</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* FLOATING DRAWER: DRAFT LOG SCROLL */}
              {showLogDrawer && (
                <div className="fixed bottom-4 right-4 z-40 max-w-sm w-full bg-parchment rounded-2xl p-4 shadow-2xl border-2 border-amber-800">
                  <div className="flex items-center justify-between border-b border-amber-900/40 pb-2 mb-2">
                    <span className="font-black font-shandalar text-amber-950 text-sm flex items-center gap-1.5">
                      <ScrollIcon /> Scroll of Draft Records
                    </span>
                    <button onClick={() => setShowLogDrawer(false)} className="text-amber-950 font-bold hover:text-amber-800 text-sm">
                      ×
                    </button>
                  </div>

                  <div className="space-y-1.5 max-h-48 overflow-y-auto pr-1 text-xs font-parchment text-amber-950 custom-scroll">
                    {draftState.pickLog.map((log, i) => (
                      <div key={i} className="flex items-center justify-between border-b border-amber-900/20 pb-1">
                        <span>Pick #{log.pick}: <strong>{log.player}</strong></span>
                        <span className="font-bold text-amber-900">{log.card}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
